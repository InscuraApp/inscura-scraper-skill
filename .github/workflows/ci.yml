name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node tools/inscura.mjs validate examples/tvmaze

  example-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p dist && node tools/inscura.mjs pack examples/tvmaze dist/tvmaze-example-v1.0.0.zip
      - name: Fail if the example README settings table is stale
        run: git diff --exit-code -- examples/tvmaze/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-example
          path: dist/tvmaze-example-v1.0.0.zip
